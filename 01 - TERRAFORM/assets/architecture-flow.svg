<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto" fill="none">
  <defs>
    <style>
      .bg { fill: #17252a; rx: 16px; }
      .card { fill: #1f333a; stroke: rgba(244, 240, 232, 0.15); stroke-width: 1.5; rx: 12px; }
      .card-accent-lime { stroke: #c9ef62; }
      .card-accent-coral { stroke: #f26b4f; }
      .text-title { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #f4f0e8; }
      .text-sub { font-family: 'DM Mono', monospace; font-size: 11px; fill: rgba(244, 240, 232, 0.7); }
      .text-badge { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; }
      .badge-lime { fill: #c9ef62; }
      .badge-coral { fill: #f26b4f; }
      .badge-cyan { fill: #79d8d1; }
      .arrow { stroke: #c9ef62; stroke-width: 2; stroke-dasharray: 4 3; stroke-linecap: round; }
      .arrow-solid { stroke: rgba(244, 240, 232, 0.3); stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #c9ef62; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c9ef62" />
    </marker>
    <marker id="arrowhead-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f26b4f" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="320" class="bg" />

  <!-- Grid subtle accents -->
  <circle cx="80" cy="40" r="1.5" fill="rgba(244,240,232,0.2)" />
  <circle cx="880" cy="40" r="1.5" fill="rgba(244,240,232,0.2)" />
  <circle cx="80" cy="280" r="1.5" fill="rgba(244,240,232,0.2)" />
  <circle cx="880" cy="280" r="1.5" fill="rgba(244,240,232,0.2)" />

  <!-- Pipeline Step 1: VS Code -->
  <g transform="translate(30, 70)">
    <rect width="160" height="180" class="card" />
    <circle cx="28" cy="32" r="14" fill="#17252a" stroke="#79d8d1" stroke-width="1.5" />
    <text x="24" y="36" class="text-badge badge-cyan">01</text>
    <text x="20" y="75" class="text-title">VS Code</text>
    <text x="20" y="98" class="text-sub">Entorno Local</text>
    <path d="M 20 120 L 140 120" stroke="rgba(244,240,232,0.1)" stroke-width="1" />
    <text x="20" y="142" class="text-sub">• HTML5 / CSS3</text>
    <text x="20" y="160" class="text-sub">• JavaScript</text>
  </g>

  <!-- Step 1 to 2 Connector -->
  <line x1="195" y1="160" x2="215" y2="160" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Pipeline Step 2: IA + MCP -->
  <g transform="translate(220, 55)">
    <rect width="180" height="210" class="card card-accent-lime" />
    <rect x="20" y="20" width="60" height="20" rx="4" fill="#17252a" />
    <text x="27" y="34" class="text-badge badge-lime">MCP PROTOCOL</text>
    <text x="20" y="72" class="text-title">IA Assistant</text>
    <text x="20" y="92" class="text-sub">Gemini CLI / Claude</text>
    <path d="M 20 110 L 160 110" stroke="rgba(244,240,232,0.1)" stroke-width="1" />
    <rect x="20" y="125" width="140" height="32" rx="6" fill="#17252a" />
    <text x="28" y="145" class="text-sub" fill="#c9ef62">server-filesystem</text>
    <text x="20" y="180" class="text-sub">• Generación código</text>
    <text x="20" y="196" class="text-sub">• Refactorización</text>
  </g>

  <!-- Step 2 Split into Terraform & AWS CLI -->
  <!-- Top branch to Terraform -->
  <path d="M 405 130 C 440 130, 440 90, 475 90" class="arrow" marker-end="url(#arrowhead)" />
  <!-- Bottom branch to AWS CLI -->
  <path d="M 405 190 C 440 190, 440 230, 475 230" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Pipeline Step 3A: Terraform (IaC) -->
  <g transform="translate(480, 25)">
    <rect width="200" height="125" class="card" />
    <circle cx="28" cy="28" r="12" fill="#17252a" stroke="#c9ef62" stroke-width="1.5" />
    <text x="24" y="32" class="text-badge badge-lime">IaC</text>
    <text x="20" y="65" class="text-title">Terraform</text>
    <text x="20" y="85" class="text-sub">Infraestructura como Código</text>
    <text x="20" y="105" class="text-sub" fill="#c9ef62">S3 Bucket + Website Config</text>
  </g>

  <!-- Pipeline Step 3B: AWS CLI -->
  <g transform="translate(480, 170)">
    <rect width="200" height="125" class="card" />
    <circle cx="28" cy="28" r="12" fill="#17252a" stroke="#f26b4f" stroke-width="1.5" />
    <text x="24" y="32" class="text-badge badge-coral">CLI</text>
    <text x="20" y="65" class="text-title">AWS CLI</text>
    <text x="20" y="85" class="text-sub">Sincronización de Archivos</text>
    <text x="20" y="105" class="text-sub" fill="#f26b4f">aws s3 sync ./ s3://...</text>
  </g>

  <!-- Join into Amazon S3 Website -->
  <path d="M 685 87 C 715 87, 715 140, 735 140" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 685 232 C 715 232, 715 180, 735 180" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Pipeline Step 4: Amazon S3 (Live Website) -->
  <g transform="translate(740, 55)">
    <rect width="190" height="210" class="card card-accent-coral" />
    <rect x="20" y="20" width="80" height="20" rx="4" fill="#17252a" />
    <text x="27" y="34" class="text-badge badge-coral">HOSTING S3</text>
    <text x="20" y="72" class="text-title">Amazon S3</text>
    <text x="20" y="92" class="text-sub">Static Website Endpoint</text>
    <path d="M 20 110 L 170 110" stroke="rgba(244,240,232,0.1)" stroke-width="1" />
    <text x="20" y="135" class="text-sub">index.html (HTML5)</text>
    <text x="20" y="153" class="text-sub">css/styles.css</text>
    <text x="20" y="171" class="text-sub">js/app.js</text>
    <rect x="20" y="185" width="150" height="22" rx="4" fill="rgba(242, 107, 79, 0.15)" />
    <text x="28" y="200" class="text-sub" fill="#f26b4f">http://...s3-website...</text>
  </g>
</svg>

